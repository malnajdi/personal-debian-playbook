# Fonts
# Nerd Fonts to download from https://github.com/ryanoasis/nerd-fonts/releases
nerd_fonts_version: v3.5.1
nerd_fonts:
  - JetBrainsMono
ui_font: JetBrainsMono Nerd Font
ui_font_size: 11

# Xmonad
xmonad_border_width: 2
# Gap in pixels between windows, and between windows and the screen edge
xmonad_gap: 6
# Show the workspace name in the middle of the screen when you change workspace
xmonad_show_workspace_name: true

# Xmobar
# Each screen gets the same bar.
# The "Propo" variant gives the icons their full width.
bar_font: JetBrainsMono Nerd Font Propo
bar_height: 34
bar_font_size: 12
# Space between the bar and the screen edges. Use 0 for a bar that touches the edges.
# Two times the xmonad gap lines up the bar with the window edges.
bar_margin: "{{ xmonad_gap * 2 }}"
# 0 is fully transparent, 255 is opaque. Needs picom.
bar_alpha: 235

# Picom
# Backend: glx, egl or xrender. If windows or the bar do not update, or the
# screen is black, try "egl", then "xrender" (no blur with xrender).
picom_backend: glx
picom_corner_radius: 10
picom_animations: true
picom_opacity_apps:
  - name: st-256color
    opacity: 95
  - name: Code
    opacity: 97
  - name: steam
    opacity: 100

# Shell (bash)
# Commands that bash keeps in memory. Ctrl+R searches them.
bash_history_size: 100000
# Commands that bash does not keep (exact match)
bash_history_ignore:
  - ls
  - cd
  - pwd
  - clear
  - exit
  - history

# Default editor: EDITOR, VISUAL and the "editor" command.
# Use /bin/nano for nano.
default_editor: /usr/local/bin/nvim

# Neovim and LazyVim
# Debian 13 has Neovim 0.10 and tree-sitter 0.22. LazyVim needs newer ones,
# so the playbook installs these releases from GitHub.
neovim_version: v0.12.6
tree_sitter_version: v0.27.1
# LazyVim extras: https://www.lazyvim.org/extras
lazyvim_extras:
  - lang.python
  - lang.typescript
  - lang.go
  - lang.json
  - lang.yaml
  - lang.markdown
  - lang.docker
  - lang.ansible
  # - lang.php

# Screenshots (flameshot)
screenshot_path: "{{ user_home_path }}/Pictures/Screenshots"

# Clipboard history (CopyQ)
copyq_max_items: 500

# Power
# These are the defaults. The power settings menu (Super+Shift+X, then
# "Power settings") changes them, and keeps your choices after a restart.
# Minutes without keyboard or mouse input before the screen turns off (0: never)
power_screen_off_minutes: 10
# Lock the screen when it turns off. The screen always locks before sleep.
power_lock_on_screen_off: true
# Minutes without input before the computer sleeps (0: never). It does not
# sleep while sound plays.
power_sleep_minutes: 0
# Power button: menu (the power menu), suspend, poweroff or ignore.
# A long press always turns the computer off.
power_key: menu

# Default programs (~/.config/mimeapps.list)
# Images open in nsxiv together with the other images of their folder.
image_mime_types:
  - image/png
  - image/jpeg
  - image/gif
  - image/webp
  - image/bmp
  - image/tiff
  - image/avif
  - image/heic
  - image/heif
  - image/jxl
  - image/svg+xml
default_apps:
  - desktop: nsxiv-browse.desktop
    mime_types: "{{ image_mime_types }}"
  - desktop: org.pwmt.zathura-pdf-poppler.desktop
    mime_types:
      - application/pdf

# Developer tools in the home directory: uv (~/.local/bin), pyenv (~/.pyenv)
# and nvm (~/.nvm). To update a tool, change its version here and run the
# playbook. The playbook puts back these versions after "uv self update" or
# "pyenv update".
uv_version: 0.9.28
pyenv_version: v2.6.3
# Plugins from https://github.com/pyenv
pyenv_plugins:
  - pyenv-virtualenv
# Python versions that pyenv builds (some minutes for each version).
# "pyenv global" stays as you set it.
pyenv_python_versions:
  - 3.12.11
nvm_version: v0.40.3
# Node.js version (with the "v") that nvm installs and sets as the default.
# Programs that start from the desktop use it too, for example Mason in Neovim.
nvm_node_version: v24.2.0

# Suckless terminal
# Font size in pixels. 15 px is about 11 pt (ui_font_size) at 100 dpi.
st_font_size: 15
st_padding: 14

# Vscode Extentions
vscode_extentions:
  - EditorConfig.EditorConfig
  - mhutchie.git-graph
  - dbaeumer.vscode-eslint

# Sysctl values for /etc/sysctl.d/99-local.conf
# Used by reactjs watcher
sysctl_settings:
  fs.inotify.max_user_watches: 524288
