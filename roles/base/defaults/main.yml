# Packages for the desktop session: X server, compositor, notifications,
# themes, and the libraries to build st.
desktop_packages:
  - xorg
  - xdotool
  - picom
  - dunst
  - libnotify-bin
  - polkitd
  - papirus-icon-theme
  - gnome-themes-extra
  - pkg-config
  - libx11-dev
  - libxft-dev
  - libfontconfig-dev
  - libfreetype-dev
  - xz-utils

# Installed only when the device has Wi-Fi or Bluetooth
wifi_packages:
  - network-manager
  - rfkill
bluetooth_packages:
  - bluez
  - rfkill

snap_packages:
  - name: code
    classic: yes
  - name: bluemail
    classic: no

# The name of the default wallpaper to be used
# Name is the exact name in the files/wallpaper folder.
default_user_wallpaper_name: "12"

# Number of monitors that nitrogen sets a wallpaper on
wallpaper_screens: 4

