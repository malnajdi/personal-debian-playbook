---
# The X handlers apply changes to a running session. On a fresh install
# there is no X session yet, so they do not fail.
- name: restart xmonad
  command: xmonad --restart
  become: true
  become_user: "{{ user }}"
  environment:
    DISPLAY: ":0"
  failed_when: false

- name: restore nitrogen
  command: nitrogen --restore
  become: true
  become_user: "{{ user }}"
  environment:
    DISPLAY: ":0"
  failed_when: false

# Start picom again with the new configuration. picom 12 can stop when it gets
# SIGUSR1 (the old way to reload), so stop it and start it.
- name: restart picom
  shell: pkill -x -u {{ user }} picom; sleep 1; picom -b
  become: true
  become_user: "{{ user }}"
  environment:
    DISPLAY: ":0"
  failed_when: false

# D-Bus starts dunst again with the new configuration at the next notification
- name: restart dunst
  command: pkill -x -u {{ user }} dunst
  failed_when: false

- name: reload deamon
  command: "systemctl daemon-reload"

- name: reconfigure fontconfig
  command: "dpkg-reconfigure fontconfig"

- name: update font cache
  command: "fc-cache -f"

- name: reload xresources
  command: "xrdb -merge {{ user_home_path }}/.Xresources"
  become: true
  become_user: "{{ user }}"
  environment:
    DISPLAY: ":0"
  failed_when: false
