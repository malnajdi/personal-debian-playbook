---
# Configure APT
# Debian 13 uses the deb822 format in /etc/apt/sources.list.d/debian.sources
- name: APT - find the Debian archive keyring
  stat:
    path: /usr/share/keyrings/debian-archive-keyring.pgp
  register: apt_keyring_pgp

- name: APT - set sources
  template:
    src: debian.sources.j2
    dest: /etc/apt/sources.list.d/debian.sources
    owner: root
    group: root
    mode: 0644
  vars:
    apt_keyring: "/usr/share/keyrings/debian-archive-keyring.{{ 'pgp' if apt_keyring_pgp.stat.exists else 'gpg' }}"
  when: apt_set_source_list
  register: apt_debian_sources

- name: APT - remove old one-line sources
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list
    - /etc/apt/sources.list.d/backports.list
  when: apt_set_source_list
  register: apt_old_sources

- name: APT - get foreign architectures
  command: dpkg --print-foreign-architectures
  register: dpkg_foreign_archs
  changed_when: false

- name: APT - enable i386 architecture
  command: dpkg --add-architecture i386
  when: enable_i386_arch and 'i386' not in dpkg_foreign_archs.stdout_lines
  register: arch_configuration

- name: APT - update debian sources
  apt:
    update_cache: yes
    cache_valid_time: "{{ 0 if (apt_debian_sources.changed or apt_old_sources.changed or arch_configuration.changed) else 3600 }}"

- name: APT - accept the Steam license
  debconf:
    name: steam
    question: "{{ item.question }}"
    value: "{{ item.value }}"
    vtype: "{{ item.vtype }}"
  loop:
    - { question: steam/question, value: "I AGREE", vtype: select }
    - { question: steam/license, value: "", vtype: note }
  when: "'steam' in essential_packages"

- name: APT - install essential packages
  apt:
    name: "{{ essential_packages + desktop_packages }}"

# Wi-Fi and Bluetooth: install the tools and show them in the bar only when the device has the hardware
- name: Check for Wi-Fi and Bluetooth devices
  shell: ls -d /sys/class/net/*/wireless /sys/class/bluetooth/hci* 2>/dev/null
  register: wireless_devices
  changed_when: false
  failed_when: false

- name: Set Wi-Fi and Bluetooth facts
  set_fact:
    has_wifi: "{{ wireless_devices.stdout_lines | select('search', '/wireless$') | list | length > 0 }}"
    has_bluetooth: "{{ wireless_devices.stdout_lines | select('search', '^/sys/class/bluetooth/') | list | length > 0 }}"

- name: APT - install Wi-Fi and Bluetooth packages
  apt:
    name: "{{ ((wifi_packages if has_wifi else []) + (bluetooth_packages if has_bluetooth else [])) | unique }}"
  when: has_wifi or has_bluetooth

# NetworkManager does not change the interfaces in /etc/network/interfaces (for example the wired one)
- name: Enable NetworkManager
  systemd:
    name: NetworkManager
    enabled: yes
    state: started
  when: has_wifi

- name: Enable Bluetooth
  systemd:
    name: bluetooth
    enabled: yes
    state: started
  when: has_bluetooth

# Install Spand packages
- name: Snapd - wait for the snap system to be ready
  command: snap wait system seed.loaded
  changed_when: false
  ignore_errors: yes

- name: Snapd - install packages
  snap:
    name: "{{ item.name }}"
    classic: "{{ item.classic }}"
  loop: "{{ snap_packages }}"
  ignore_errors: yes

- name: Create default directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ group }}"
  loop: "{{ directories }}"

- name: Create system directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: 0755
  loop:
    - /etc/lightdm/lightdm.conf.d
    - /usr/share/backgrounds
    - /usr/local/share/applications

# Remove files from the old setup (compton, old xmobar configs, polkit pkla)
- name: Remove replaced configuration files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ user_config_path }}/compton"
    - "{{ user_config_path }}/xmobar/xmobarrc0"
    - "{{ user_config_path }}/xmobar/xmobarrc1"
    - "{{ user_config_path }}/xmobar/xmobarrc-secondary"
    - "{{ user_config_path }}/.nanorc"
    - "{{ user_config_path }}/Code/User/vscode.json"
    - /etc/polkit-1/localauthority/50-local.d/allow-mount-policy.pkla

# Picom (compositor: rounded corners, shadows, blur, fading)
- name: Configure picom
  template:
    src: picom.conf.j2
    dest: "{{ user_config_path }}/picom/picom.conf"
    owner: "{{ user }}"
    group: "{{ group }}"
  notify: restart picom

- name: Configure picom shaders
  template:
    src: picom-corners.glsl.j2
    dest: "{{ user_config_path }}/picom/shaders/{{ item.name }}.glsl"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: 0644
  loop: "{{ picom_corner_shaders }}"
  notify: restart picom

# X session start (starts picom before xmonad)
- name: Configure .xsessionrc
  template:
    src: .xsessionrc.j2
    dest: "{{ user_home_path }}/.xsessionrc"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: 0644

# Suckless Terminal
- name: Check if suckless terminal (st) is installed
  stat:
    path: /usr/local/bin/st
  register: st_installed

- name: Extract suckless terminal (st)
  unarchive:
    src: st-0.8.2.tar.gz
    dest: "{{ user_config_path }}"
    owner: "{{ user }}"
    group: "{{ group }}"
  when: not st_installed.stat.exists

# Fixes for Neovim 0.12. See the patch file.
- name: Patch suckless terminal (st)
  patch:
    src: st-0.8.2-neovim.patch
    basedir: "{{ user_config_path }}/st-0.8.2"
  register: st_patched

- name: Configure suckless terminal (st)
  template:
    src: st_config.h.j2
    dest: "{{ user_config_path }}/st-0.8.2/config.h"
    owner: "{{ user }}"
    group: "{{ group }}"
  register: st_configured

- name: Build Suckless terminal (st)
  command: make clean install
  args:
    chdir: "{{ user_config_path }}/st-0.8.2/"
  when: st_configured.changed or st_patched.changed or not st_installed.stat.exists

# Rofi (application launcher and menus)
- name: Configure rofi
  template:
    src: rofi.rasi.j2
    dest: "{{ user_config_path }}/rofi/config.rasi"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: 0644

- name: Configure rofi scripts
  template:
    src: "{{ item }}.j2"
    dest: "{{ user_config_path }}/{{ item }}"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: 0755
  loop: "{{ ['alias_dmenu.sh', 'powermenu.sh']
    + (['wifi-menu.sh'] if has_wifi else [])
    + (['bluetooth-menu.sh'] if has_bluetooth else []) }}"

# Dunst (notifications)
- name: Configure dunst
  template:
    src: dunstrc.j2
    dest: "{{ user_config_path }}/dunst/dunstrc"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: 0644
  notify: restart dunst

# Xmonad
- name: Configure xmonad
  template:
    src: xmonad.hs.j2
    dest: "{{ xmonad_config_path }}/xmonad.hs"
    owner: "{{ user }}"
    group: "{{ group }}"
  register: xmonad_configured

- name: Check if xmonad is compiled
  stat:
    path: "{{ xmonad_config_path }}/xmonad-{{ ansible_architecture }}-linux"
  register: xmonad_compiled

- name: Compile xmonad
  command: xmonad --recompile
  become: true
  become_user: "{{ user }}"
  when: xmonad_configured.changed or not xmonad_compiled.stat.exists
  notify: restart xmonad

# Xmobar
- name: Check for a battery
  find:
    paths: /sys/class/power_supply
    patterns: "BAT*"
    file_type: any
  register: power_supply_batteries

- name: Configure xmobar
  template:
    src: xmobarrc.j2
    dest: "{{ user_config_path }}/xmobar/xmobarrc"
    owner: "{{ user }}"
    group: "{{ group }}"
  vars:
    has_battery: "{{ power_supply_batteries.matched > 0 }}"
  notify: restart xmonad

- name: Configure xmobar scripts
  template:
    src: "{{ item }}.j2"
    dest: "{{ user_config_path }}/xmobar/scripts/{{ item }}"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: 0755
  loop: "{{ ['volume.sh']
    + (['wifi.sh'] if has_wifi else [])
    + (['bluetooth.sh'] if has_bluetooth else []) }}"

# .Xresources
- name: Configure .Xresources
  template:
    src: .Xresources.j2
    dest: "{{ user_home_path }}/.Xresources"
    owner: "{{ user }}"
    group: "{{ group }}"
  notify: reload xresources

# GTK (dark theme and icons for GTK applications)
- name: Configure GTK 3 and GTK 4
  template:
    src: gtk-settings.ini.j2
    dest: "{{ user_config_path }}/{{ item }}/settings.ini"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: 0644
  loop:
    - gtk-3.0
    - gtk-4.0

- name: Configure GTK 2
  template:
    src: .gtkrc-2.0.j2
    dest: "{{ user_home_path }}/.gtkrc-2.0"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: 0644

# Fonts
- name: Install Fonts
  copy:
    src: "{{ item }}"
    dest: "/usr/local/share/fonts/{{ item | basename }}"
    owner: root
    group: root
  loop: "{{ q('fileglob', 'files/fonts/*.ttf') }}"
  notify: update font cache

- name: Create Nerd Fonts directories
  file:
    path: "/usr/local/share/fonts/nerd-fonts/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: 0755
  loop: "{{ nerd_fonts }}"

- name: Install Nerd Fonts
  unarchive:
    src: "https://github.com/ryanoasis/nerd-fonts/releases/download/{{ nerd_fonts_version }}/{{ item }}.tar.xz"
    dest: "/usr/local/share/fonts/nerd-fonts/{{ item }}"
    remote_src: yes
    creates: "/usr/local/share/fonts/nerd-fonts/{{ item }}/{{ nerd_fonts_version }}"
  loop: "{{ nerd_fonts }}"
  register: nerd_fonts_installed
  notify: update font cache

- name: Mark Nerd Fonts version
  copy:
    content: ""
    dest: "/usr/local/share/fonts/nerd-fonts/{{ item }}/{{ nerd_fonts_version }}"
  loop: "{{ nerd_fonts }}"
  when: nerd_fonts_installed.changed

# Flush the font cache now, so the next steps can use the new fonts
- name: Flush handlers
  meta: flush_handlers

# Nitrogen & wallpapers
- name: Copy wallpapers
  copy:
    src: wallpapers/
    dest: "{{ user_wallpaper_path }}/"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: 0644

- name: Configure nitrogen & wallpaper
  template:
    src: "{{ item }}.j2"
    dest: "{{ user_config_path }}/nitrogen/{{ item }}"
    owner: "{{ user }}"
    group: "{{ group }}"
  loop:
    - nitrogen.cfg
    - bg-saved.cfg
  register: nitrogen_status
  notify: restore nitrogen

# Login screen (lightdm)
- name: Copy wallpaper for the login screen
  copy:
    src: "wallpapers/{{ default_user_wallpaper_name }}.png"
    dest: "{{ greeter_wallpaper }}"
    owner: root
    group: root
    mode: 0644

- name: Configure lightdm
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: 0644
  loop:
    - src: lightdm-gtk-greeter.conf.j2
      dest: /etc/lightdm/lightdm-gtk-greeter.conf
    - src: lightdm-xmonad.conf.j2
      dest: /etc/lightdm/lightdm.conf.d/50-xmonad.conf

# Lock Screen (i3lock)
- name: Configure i3lock script
  template:
    src: lock_multi_screen.sh.j2
    dest: "{{ user_config_path }}/i3lock/lock_multi_screen.sh"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: 0744

# Language
- name: Create change language script
  template:
    src: change-lang.sh.j2
    dest: "{{ user_config_path }}/change-lang.sh"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: a+x

# Bash Aliases
- name: Enable bash aliases
  template:
    src: .bash_aliases.j2
    dest: "{{ user_home_path }}/.bash_aliases"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: 0644

# Bash (history, fzf and the editor)
# Debian calls bat "batcat" and fd "fdfind". fzf, LazyVim and you use the usual names.
- name: Bash - link bat and fd to their Debian names
  file:
    src: "/usr/bin/{{ item.src }}"
    dest: "/usr/local/bin/{{ item.dest }}"
    state: link
  loop:
    - { src: batcat, dest: bat }
    - { src: fdfind, dest: fd }

- name: Bash - configure history and fzf
  template:
    src: bashrc.j2
    dest: "{{ user_config_path }}/bash/bashrc"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: 0644

# ~/.bashrc of Debian sets HISTFILESIZE=2000, and bash cuts the history file
# to 2000 lines at that line. ~/.config/bash/bashrc sets the history size.
- name: Bash - remove the history size from ~/.bashrc
  lineinfile:
    path: "{{ user_home_path }}/.bashrc"
    regexp: '^({{ item }}=.*)$'
    line: '# \1  (set in ~/.config/bash/bashrc)'
    backrefs: yes
  loop:
    - HISTSIZE
    - HISTFILESIZE

# fzf lines that were added by hand before the playbook managed fzf
- name: Bash - remove the old fzf lines from ~/.bashrc
  lineinfile:
    path: "{{ user_home_path }}/.bashrc"
    regexp: '^(source|\.) /usr/share/doc/fzf/examples/|^export FZF_'
    state: absent

- name: Bash - load ~/.config/bash/bashrc from ~/.bashrc
  blockinfile:
    path: "{{ user_home_path }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK (personal-debian-playbook)"
    block: |
      # History, fzf and the editor. Edit roles/base/templates/bashrc.j2.
      [ -f ~/.config/bash/bashrc ] && . ~/.config/bash/bashrc
    owner: "{{ user }}"
    group: "{{ group }}"
    create: yes

# Polkit reads the rules again when a file changes. A restart is not necessary.
- name: Configure polkit rules
  template:
    src: "{{ item }}.j2"
    dest: "/etc/polkit-1/rules.d/{{ item }}"
    owner: root
    group: root
    mode: 0644
  loop:
    - 50-allow-mount.rules
    - 50-allow-network.rules

# sysctl
# Debian 13 does not read /etc/sysctl.conf. Use /etc/sysctl.d.
- name: Configure sysctl
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-local.conf
  loop: "{{ sysctl_settings | dict2items }}"

# User Groups
- name: Add default user to virt-manager group
  user:
    name: "{{ user }}"
    state: present
    groups:
      - libvirt
      - sudo
    append: yes

- name: Add default user to bluetooth group
  user:
    name: "{{ user }}"
    groups:
      - bluetooth
    append: yes
  when: has_bluetooth

# .files
# VSCode reads its settings from settings.json
- name: Configure VSCode
  template:
    src: "{{ item.src }}.j2"
    dest: "{{ user_config_path }}/Code/User/{{ item.dest }}"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: 0644
  loop:
    - { src: vscode.json, dest: settings.json }
    - { src: keybindings.json, dest: keybindings.json }

# Install vscode extentions
- name: Check if vscode is installed
  stat:
    path: /snap/bin/code
  register: vscode_installed

- name: Install vscode extentions
  command: 'snap run code --install-extension {{ item }}'
  # The extensions in the list, and the theme of the palette (theme_name)
  loop: "{{ vscode_extentions + [theme.vscode_extension] }}"
  become: true
  become_user: "{{ user }}"
  when: vscode_installed.stat.exists
  ignore_errors: yes

# Nano
- name: Configure nano
  template:
    src: ".nanorc.j2"
    dest: "{{ user_config_path }}/nano/nanorc"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: 0644

# GIT
- name: Configure git
  template:
    src: ".gitconfig.j2"
    dest: "{{ user_home_path }}/.gitconfig"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: 0644

# Neovim and LazyVim
- name: Neovim - create the install directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: 0755
  loop:
    - "/opt/neovim/{{ neovim_version }}"
    - "/opt/tree-sitter/{{ tree_sitter_version }}"

- name: Neovim - install
  unarchive:
    src: "https://github.com/neovim/neovim/releases/download/{{ neovim_version }}/nvim-linux-x86_64.tar.gz"
    dest: "/opt/neovim/{{ neovim_version }}"
    remote_src: yes
    creates: "/opt/neovim/{{ neovim_version }}/nvim-linux-x86_64/bin/nvim"

# nvim-treesitter builds the language parsers with the tree-sitter CLI
- name: Neovim - install the tree-sitter CLI
  unarchive:
    src: "https://github.com/tree-sitter/tree-sitter/releases/download/{{ tree_sitter_version }}/tree-sitter-cli-linux-x64.zip"
    dest: "/opt/tree-sitter/{{ tree_sitter_version }}"
    remote_src: yes
    creates: "/opt/tree-sitter/{{ tree_sitter_version }}/tree-sitter"

# The menu entry opens Neovim in the terminal of rofi (st)
- name: Neovim - link the programs and the menu entry
  file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: yes
  loop:
    - src: "/opt/neovim/{{ neovim_version }}/nvim-linux-x86_64/bin/nvim"
      dest: /usr/local/bin/nvim
    - src: "/opt/neovim/{{ neovim_version }}/nvim-linux-x86_64/share/applications/nvim.desktop"
      dest: /usr/local/share/applications/nvim.desktop
    - src: "/opt/tree-sitter/{{ tree_sitter_version }}/tree-sitter"
      dest: /usr/local/bin/tree-sitter

- name: LazyVim - configure
  template:
    src: "nvim/{{ item }}.j2"
    dest: "{{ user_config_path }}/nvim/{{ item }}"
    owner: "{{ user }}"
    group: "{{ group }}"
    mode: 0644
  loop:
    - init.lua
    - lua/config/lazy.lua
    - lua/config/options.lua
    - lua/config/keymaps.lua
    - lua/config/autocmds.lua
    - lua/plugins/theme.lua
  register: lazyvim_configured

# Install the plugins now, so the first start of nvim is fast.
# Mason installs the language servers when nvim starts the first time.
- name: LazyVim - install the plugins
  command: nvim --headless "+Lazy! install" +qa
  become: true
  become_user: "{{ user }}"
  when: lazyvim_configured.changed

# EDITOR and VISUAL are in ~/.config/bash/bashrc. This is for programs that
# run the "editor" command.
- name: Set the default editor
  alternatives:
    name: editor
    path: "{{ default_editor }}"
